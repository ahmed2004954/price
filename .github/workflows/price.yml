name: Price to Telegram

on:
  workflow_dispatch:
  schedule:
    
    - cron: "0 */1 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZ: Africa/Cairo
        run: |
          python price_to_telegram.py

      - name: Commit state file if changed
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain last_price.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_price.json
            git commit -m "Update last_price.json"
            git push
          else
            echo "No changes in last_price.json"
          fi
